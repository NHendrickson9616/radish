[package]
name = "radishes"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
lofty = "0.25"
opus = "0.3.1"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
symphonia = { version = "0.5.5", features = ["aac", "alac", "isomp4", "mp3"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5.0"
